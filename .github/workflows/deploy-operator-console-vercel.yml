name: Deploy Operator Console to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'workforce-control/**'
      - '.github/workflows/deploy-operator-console-vercel.yml'
  workflow_dispatch:

concurrency:
  group: operator-console-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: workforce-control
    env:
      VERCEL_ORG_ID: team_ttO0XqcAiOf2k3Z2k86noiLa
      VERCEL_PROJECT_ID: prj_bbZsYge24gqwNMVF0oCEdSiCPvy6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workforce-control/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          rm -rf .vercel
          vercel link --yes --project=v0-aion-ops-command-center --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
